<!doctype html><html lang="ja"><meta charset="utf-8"><title>SVG Converter browser smoke test</title><h1>ブラウザ実機スモークテスト</h1><p>GitHub PagesまたはローカルHTTP経由で開いてください。このページの成功は全機能の受入完了を意味しません。</p><pre id="log" role="status"></pre><script type="module">
import{inspect,render,dimensions}from'../js/svg.js';import{blobCanvas}from'../js/encoders.js';const log=document.getElementById('log'),write=s=>log.textContent+=s+'\n';let failed=0;function assert(b,m){if(!b)throw Error(m);}const names=['01_overview','02_setup_flow','03_permission_modes','04_work_cycle','05_choose_tool'],heights=[500,560,440,400,500];
for(let i=0;i<names.length;i++){try{const r=await fetch('../samples/'+names[i]+'.svg');assert(r.ok,'HTTP '+r.status);const info=inspect(await r.text()),s={preset:'original',fit:'contain',bg:'transparent'},c=await render(info,s,null),b=await blobCanvas(c),sig=new Uint8Array(await b.arrayBuffer());assert(c.width===880&&c.height===heights[i],'dimensions');assert(sig[0]===137&&sig[1]===80,'PNG signature');write('PASS '+names[i]+' '+c.width+'×'+c.height+' '+b.size+' bytes');}catch(e){failed++;write('FAIL '+names[i]+' '+e.message);}}
for(const content of ['<script>throw 1</script>','<rect onload="throw 1"/>','<image href="https://example.com/test.png"/>','<animate attributeName="x"/>']){let rejected=false;try{inspect('<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10">'+content+'</svg>');}catch{rejected=true;}if(!rejected)failed++;write((rejected?'PASS':'FAIL')+' reject '+content);}
write('Finished; failures='+failed);document.title=failed?'FAIL':'PASS';
</script></html>
