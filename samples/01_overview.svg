<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" font-family="'Yu Gothic UI','Meiryo','Hiragino Sans',sans-serif">
  <title>VSCodeの中でのClaude CodeとCodexの位置関係</title>
  <rect x="0" y="0" width="880" height="500" fill="#ffffff"/>

  <!-- 見出し -->
  <text x="440" y="34" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">図1　VSCodeの中の2つのAIエージェント（全体像）</text>

  <!-- VSCode外枠 -->
  <rect x="30" y="56" width="580" height="380" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="46" y="82" font-size="15" font-weight="bold" fill="#374151">VSCode（Windows 11）</text>

  <!-- エディター -->
  <rect x="50" y="96" width="250" height="200" rx="6" fill="#ffffff" stroke="#9ca3af"/>
  <text x="175" y="124" font-size="14" font-weight="bold" text-anchor="middle" fill="#374151">エディター</text>
  <text x="175" y="150" font-size="12" text-anchor="middle" fill="#4b5563">開いているファイル</text>
  <text x="175" y="170" font-size="12" text-anchor="middle" fill="#4b5563">選択中の行</text>
  <text x="175" y="200" font-size="12" text-anchor="middle" fill="#4b5563">差分（diff）表示で</text>
  <text x="175" y="218" font-size="12" text-anchor="middle" fill="#4b5563">変更を確認・承認</text>
  <text x="175" y="262" font-size="11" text-anchor="middle" fill="#6b7280">※文脈として自動で</text>
  <text x="175" y="278" font-size="11" text-anchor="middle" fill="#6b7280">エージェントに渡る</text>

  <!-- Claude Code パネル -->
  <rect x="320" y="96" width="270" height="92" rx="6" fill="#fdf1ea" stroke="#d97757" stroke-width="2"/>
  <text x="455" y="122" font-size="14" font-weight="bold" text-anchor="middle" fill="#9a3412">Claude Code 拡張パネル</text>
  <text x="455" y="146" font-size="12" text-anchor="middle" fill="#7c2d12">起動：エディター右上のSparkアイコン</text>
  <text x="455" y="166" font-size="12" text-anchor="middle" fill="#7c2d12">指示書：CLAUDE.md</text>

  <!-- Codex パネル -->
  <rect x="320" y="204" width="270" height="92" rx="6" fill="#ecfdf5" stroke="#10a37f" stroke-width="2"/>
  <text x="455" y="230" font-size="14" font-weight="bold" text-anchor="middle" fill="#065f46">Codex 拡張パネル</text>
  <text x="455" y="254" font-size="12" text-anchor="middle" fill="#064e3b">起動：サイドバーのCodexアイコン</text>
  <text x="455" y="274" font-size="12" text-anchor="middle" fill="#064e3b">指示書：AGENTS.md</text>

  <!-- 統合ターミナル -->
  <rect x="50" y="316" width="540" height="100" rx="6" fill="#111827" stroke="#374151"/>
  <text x="66" y="342" font-size="13" font-weight="bold" fill="#f9fafb">統合ターミナル（補足：CLIで使う場合）</text>
  <text x="66" y="368" font-size="13" fill="#fdba74" font-family="Consolas,'Courier New',monospace">PS&gt; claude</text>
  <text x="250" y="368" font-size="12" fill="#d1d5db">… Claude Code CLI（別途インストール）</text>
  <text x="66" y="394" font-size="13" fill="#6ee7b7" font-family="Consolas,'Courier New',monospace">PS&gt; codex</text>
  <text x="250" y="394" font-size="12" fill="#d1d5db">… Codex CLI（別途インストール）</text>

  <!-- 矢印：エディター→パネル -->
  <line x1="300" y1="160" x2="318" y2="150" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="300" y1="236" x2="318" y2="246" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- クラウド側 -->
  <rect x="650" y="96" width="200" height="92" rx="10" fill="#fff7ed" stroke="#d97757" stroke-dasharray="6 4"/>
  <text x="750" y="124" font-size="13" font-weight="bold" text-anchor="middle" fill="#9a3412">Anthropic</text>
  <text x="750" y="146" font-size="12" text-anchor="middle" fill="#7c2d12">Claudeモデル</text>
  <text x="750" y="168" font-size="11" text-anchor="middle" fill="#7c2d12">Pro / Max 契約でログイン</text>

  <rect x="650" y="204" width="200" height="92" rx="10" fill="#f0fdf4" stroke="#10a37f" stroke-dasharray="6 4"/>
  <text x="750" y="232" font-size="13" font-weight="bold" text-anchor="middle" fill="#065f46">OpenAI</text>
  <text x="750" y="254" font-size="12" text-anchor="middle" fill="#064e3b">GPTモデル＋Codex web</text>
  <text x="750" y="276" font-size="11" text-anchor="middle" fill="#064e3b">ChatGPT Plus / Pro でログイン</text>

  <line x1="590" y1="142" x2="648" y2="142" stroke="#d97757" stroke-width="2" marker-end="url(#arrowO)"/>
  <line x1="590" y1="250" x2="648" y2="250" stroke="#10a37f" stroke-width="2" marker-end="url(#arrowG)"/>
  <text x="619" y="134" font-size="10" text-anchor="middle" fill="#6b7280">通信</text>
  <text x="619" y="242" font-size="10" text-anchor="middle" fill="#6b7280">通信</text>

  <!-- 凡例・前提 -->
  <text x="650" y="330" font-size="12" font-weight="bold" fill="#374151">前提</text>
  <text x="650" y="350" font-size="11" fill="#4b5563">・ファイル編集とコマンド実行は</text>
  <text x="660" y="366" font-size="11" fill="#4b5563">自分のPC上（ローカル）で行う</text>
  <text x="650" y="386" font-size="11" fill="#4b5563">・推論（考える処理）は各社の</text>
  <text x="660" y="402" font-size="11" fill="#4b5563">サーバーで行う</text>

  <text x="30" y="474" font-size="11" fill="#6b7280">出典：Claude Code Docs「Use Claude Code in VS Code」、OpenAI「Codex IDE extension」（2026-10-17確認）をもとに作成</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
    <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97757"/></marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#10a37f"/></marker>
  </defs>
</svg>
