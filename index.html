<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SVG Image Converter</title><link rel="stylesheet" href="css/style.css"></head><body>
<header><div><span class="eyebrow">LOCAL IMAGE WORKSPACE</span><h1>SVG Image Converter</h1><p data-ja="SVGから、使いたい画像へ。ファイルは端末内で処理します。" data-en="Turn SVG into the images you need. Files stay on your device."></p></div><nav><select id="lang" aria-label="Language"><option value="ja">日本語</option><option value="en">English</option></select><select id="theme" aria-label="Theme"><option value="auto">System</option><option value="light">Light</option><option value="dark">Dark</option></select></nav></header>
<main><p class="notice" data-ja="検証版：静止画変換が利用できます。アニメーション・JavaScript・外部リソースの許可読み込みは技術検証未完了のため無効です。全要求の完成版ではありません。" data-en="Validation build: static conversion is available. Animation, JavaScript and external-resource loading are disabled pending validation. This is not the completed specification."></p>
<section id="drop" class="drop"><h2 data-ja="01 / SVGを追加" data-en="01 / Add SVG"></h2><label class="button"><span data-ja="ファイルを選択 / ドロップ" data-en="Select / drop SVG files"></span><input id="files" type="file" accept=".svg,image/svg+xml" multiple></label><details><summary data-ja="SVGコードを貼り付け" data-en="Paste SVG code"></summary><textarea id="source" aria-label="SVG code" placeholder="<svg …>" spellcheck="false"></textarea><button id="paste" data-ja="追加" data-en="Add"></button></details></section>
<div class="workspace"><section><h2 data-ja="02 / 変換設定" data-en="02 / Settings"></h2><label><span data-ja="設定の適用先" data-en="Settings target"></span><select id="target"><option value="all">全体 / All</option></select></label><div class="grid"><label><span data-ja="サイズ" data-en="Size"></span><select id="preset"><option value="original">Original</option><option value="scale">Scale</option><option value="custom">Custom</option><option value="1080x1080">Square 1080×1080</option><option value="1920x1080">Full HD 1920×1080</option><option value="3840x2160">4K 3840×2160</option><option value="1080x1920">Portrait 1080×1920</option><option value="1200x630">OGP 1200×630</option><option value="1500x500">Header 1500×500</option><option value="32x32">Favicon 32×32</option><option value="512x512">Icon 512×512</option></select></label><label><span data-ja="倍率" data-en="Scale"></span><input id="scale" type="number" min="0.1" max="32" step="0.1" value="2"></label><label>Width px<input id="width" type="number" min="1" value="1200"></label><label>Height px<input id="height" type="number" min="1" value="630"></label><label><span data-ja="配置" data-en="Fit"></span><select id="fit"><option value="contain">Contain</option><option value="cover">Cover</option><option value="stretch">Stretch</option></select></label><label><span data-ja="背景" data-en="Background"></span><select id="bg"><option value="transparent">Transparent</option><option value="white">White</option><option value="color">Color</option><option value="image">Image</option></select></label><label><span data-ja="背景色" data-en="Color"></span><input id="color" type="color" value="#ffffff"></label><label><span data-ja="背景画像（中央・cover）" data-en="Background image (center / cover)"></span><input id="background" type="file" accept="image/png,image/jpeg,image/webp"></label></div>
<fieldset><legend data-ja="出力形式（複数選択）" data-en="Output formats"></legend><div id="formats"></div></fieldset>
<label>ICO sizes (px)<input id="ico" value="16,32,48,256"></label><label for="naming" data-ja="ファイル名ルール" data-en="Filename template"></label><input id="naming" aria-label="Filename template" value="{name}_{width}x{height}.{ext}"><p class="muted">{name} {width} {height} {ext}</p><label>ZIP<select id="zipmode"><option value="flat">Flat</option><option value="source">By SVG</option><option value="format">By format</option></select></label><div class="actions"><button id="export" data-ja="設定JSONを保存" data-en="Export JSON"></button><label class="button"><span data-ja="設定JSONを読込" data-en="Import JSON"></span><input id="import" type="file" accept=".json"></label></div><details><summary data-ja="アニメーション（未対応）" data-en="Animation (unavailable)"></summary><fieldset disabled><label>Start s<input type="number" value="0"></label><label>End s<input type="number" value="3"></label><label>FPS<input type="number" value="30"></label><label>Loops (0 = infinite)<input type="number" value="0"></label><select><option>GIF / WebP / APNG</option></select></fieldset><p data-ja="時刻制御と隔離実行の合格条件は docs/requirements.md を参照してください。" data-en="See docs/requirements.md for timing and isolation acceptance gates."></p></details></section>
<section><h2 data-ja="03 / キューとプレビュー" data-en="03 / Queue and preview"></h2><div id="queue"></div><div class="actions"><button id="convert" class="primary" data-ja="変換する" data-en="Convert"></button><button id="cancel" data-ja="中止" data-en="Cancel"></button><button id="retry" data-ja="失敗分を再試行" data-en="Retry failed"></button><button id="clear" data-ja="すべてクリア" data-en="Clear all"></button></div><progress id="progress" max="1" value="0" aria-label="Conversion progress"></progress><p id="status" role="status" aria-live="polite"></p><div id="preview" class="preview"></div><div class="actions"><button id="zip" data-ja="ZIPを保存" data-en="Download ZIP"></button></div><div id="results"></div></section></div>
<section><h2 data-ja="変換履歴（画像は保存しません）" data-en="History (images are not stored)"></h2><label><span data-ja="保存上限" data-en="History limit"></span><input id="limit" type="number" min="1" max="10000" value="100"></label><button id="clearHistory" data-ja="履歴を全削除" data-en="Clear history"></button><div id="history"></div></section><footer>Ctrl/⌘ + Enter: Convert · Escape: Cancel · Ctrl/⌘ + Shift + S: ZIP<br><span data-ja="タブを閉じると入力と結果は破棄されます。設定はJSONで保存してください。" data-en="Inputs and results are discarded when this tab closes. Save settings as JSON."></span></footer></main><script type="module" src="js/app.js"></script></body></html>
